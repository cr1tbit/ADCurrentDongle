[project]
name = "currentdongle"
version = "0.1.0"
description = "Live current measurement with the CurrentDongle + Analog Discovery 2"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyqtgraph>=0.13",
    "PySide6>=6.5",
    "mcp>=2.3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=7"]
plots = ["matplotlib>=3.8"]

[project.scripts]
currentdongle = "currentdongle.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["currentdongle"]
